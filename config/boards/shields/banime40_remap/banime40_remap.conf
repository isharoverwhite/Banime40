# banime40_remap Shield Configuration

# BLE device name shown when pairing
CONFIG_ZMK_KEYBOARD_NAME="Banime40-remap"

# BLE: allow up to 5 paired profiles (switch with key bindings)
CONFIG_BT=y
CONFIG_ZMK_BLE=y
CONFIG_BT_MAX_CONN=5
CONFIG_BT_MAX_PAIRED=5

# Increase TX power for better BLE range on clone boards
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

# Power saving: enter deep sleep after 15 min idle (900000 ms)
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=900000

# USB HID (wired mode) + automatic host detection
# ZMK distinguishes USB charger vs USB computer via enumeration:
#   - USB plugged into computer → USB enumerated → ZMK routes HID over USB automatically
#   - USB plugged into charger  → USB not enumerated → ZMK keeps BLE active automatically
# BLE stays connected (radio on) in USB mode but sends no keystrokes — no explicit disconnect needed.
# Manual override available via &out OUT_USB / OUT_BLE / OUT_TOG bindings in Layer 4.
CONFIG_ZMK_USB=y

# Battery monitoring via nRF52840 internal VDDH/5 (no external ADC pin needed)
CONFIG_ZMK_BATTERY_REPORTING=y
CONFIG_ZMK_BATTERY_REPORT_INTERVAL=60

# Optional: enable logging for debug (disable in production)
# CONFIG_ZMK_LOG_LEVEL_DBG=y
