<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Dark background -->
  <rect width="32" height="32" rx="5" fill="#0d0d14"/>

  <!-- Row 0: 4 normal keys -->
  <rect x="3"  y="4" width="5" height="5" rx="1" fill="#1c1c2e" stroke="#2d2d48" stroke-width="0.5"/>
  <rect x="10" y="4" width="5" height="5" rx="1" fill="#1c1c2e" stroke="#2d2d48" stroke-width="0.5"/>
  <rect x="17" y="4" width="5" height="5" rx="1" fill="#1c1c2e" stroke="#2d2d48" stroke-width="0.5"/>
  <rect x="24" y="4" width="5" height="5" rx="1" fill="#1c1c2e" stroke="#2d2d48" stroke-width="0.5"/>

  <!-- Row 1: blue modifier highlight -->
  <rect x="3"  y="11" width="5" height="5" rx="1" fill="#1c1c2e" stroke="#2d2d48" stroke-width="0.5"/>
  <rect x="10" y="11" width="5" height="5" rx="1" fill="#162040" stroke="#3b82f6" stroke-width="0.8"/>
  <rect x="17" y="11" width="5" height="5" rx="1" fill="#1c1c2e" stroke="#2d2d48" stroke-width="0.5"/>
  <rect x="24" y="11" width="5" height="5" rx="1" fill="#1c1c2e" stroke="#2d2d48" stroke-width="0.5"/>

  <!-- Row 2: amber layer-trigger highlight -->
  <rect x="3"  y="18" width="5" height="5" rx="1" fill="#1c1c2e" stroke="#2d2d48" stroke-width="0.5"/>
  <rect x="10" y="18" width="5" height="5" rx="1" fill="#1c1c2e" stroke="#2d2d48" stroke-width="0.5"/>
  <rect x="17" y="18" width="5" height="5" rx="1" fill="#1c1c2e" stroke="#2d2d48" stroke-width="0.5"/>
  <rect x="24" y="18" width="5" height="5" rx="1" fill="#221500" stroke="#f59e0b" stroke-width="0.8"/>

  <!-- Row 3: small · wide spacebar · small -->
  <rect x="3"  y="25" width="5" height="4" rx="1" fill="#1c1c2e" stroke="#2d2d48" stroke-width="0.5"/>
  <rect x="10" y="25" width="12" height="4" rx="1" fill="#161626" stroke="#2d2d48" stroke-width="0.5"/>
  <rect x="24" y="25" width="5" height="4" rx="1" fill="#1c1c2e" stroke="#2d2d48" stroke-width="0.5"/>
</svg>
