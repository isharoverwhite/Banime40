name: Build ZMK firmware

on:
  push:
    paths:
      - 'config/**'
      - 'build.yaml'
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: zmkfirmware/zmk-build-arm:stable
    steps:
      - uses: actions/checkout@v4

      - name: West Init & Update
        run: |
          west init -l config
          west update -n -o=--depth=1
          west zephyr-export

      - name: Build firmware
        run: |
          west build -p -s zmk/app -b nice_nano_v2 -- \
            -DSHIELD=banime40_remap \
            -DZMK_CONFIG="${GITHUB_WORKSPACE}/config"

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: banime40_remap-nice_nano_v2
          path: build/zephyr/zmk.uf2
